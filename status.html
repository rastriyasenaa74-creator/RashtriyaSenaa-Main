<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check Status | RastriyaSenaa</title><link rel="stylesheet" href="styles.css"></head><body><header></header><main><section class="section"><div class="container"><div class="head"><h2>Check Application Status</h2><p>Enter Application ID and registered mobile number.</p></div><div class="form"><form id="form"><div class="formgrid"><div class="field"><label>Application ID *</label><input name="applicationId" required></div><div class="field"><label>Mobile *</label><input name="mobile" required></div></div><div class="buttons"><button class="btn red">CHECK STATUS</button></div><div id="msg" class="msg"></div></form></div></div></section></main><footer></footer><script src="site.js"></script><script>document.getElementById("form").onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let m=document.getElementById("msg");try{let r=await api({action:"status",...d});m.className="msg "+(r.success?"success":"error");m.innerHTML=r.success?"Name: <b>"+r.name+"</b><br>Status: <b>"+r.status+"</b><br>Member ID: <b>"+(r.memberId||"Not generated yet")+"</b>":r.message;m.style.display="block"}catch(x){m.className="msg error";m.textContent=x.message;m.style.display="block"}};</script></body></html>
