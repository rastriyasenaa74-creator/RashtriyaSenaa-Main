<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel | RashtriyaSenaa</title><link rel="stylesheet" href="styles.css"></head><body><header></header><main><section class="section"><div class="container"><div class="head"><h2>Admin Panel</h2><p>Admin ID and Password are required.</p></div><div id="loginBox" class="form"><form id="loginForm"><div class="formgrid"><div class="field"><label>Admin ID *</label><input name="adminId" required></div><div class="field"><label>Admin Password *</label><input name="password" type="password" required></div></div><div class="buttons"><button class="btn red">LOGIN</button></div><div id="loginMsg" class="msg"></div></form></div><div id="panel" style="display:none"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h3>Applications</h3><button class="btn red" onclick="loadApps()">REFRESH</button></div><div id="panelMsg" class="msg"></div><div class="tablewrap"><table class="table"><thead><tr><th>Application</th><th>Name</th><th>Mobile</th><th>District</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div></section></main><footer></footer><script src="site.js"></script><script>let admin={};document.getElementById("loginForm").onsubmit=async e=>{e.preventDefault();admin=Object.fromEntries(new FormData(e.target));let m=document.getElementById("loginMsg");try{let r=await api({action:"adminLogin",...admin});if(!r.success){m.className="msg error";m.textContent=r.message;m.style.display="block";return}document.getElementById("loginBox").style.display="none";document.getElementById("panel").style.display="block";loadApps()}catch(x){m.className="msg error";m.textContent=x.message;m.style.display="block"}};async function loadApps(){let r=await api({action:"adminList",...admin});let m=document.getElementById("panelMsg");if(!r.success){m.className="msg error";m.textContent=r.message;m.style.display="block";return}let rows=document.getElementById("rows");rows.innerHTML="";(r.applications||[]).forEach(x=>{let tr=document.createElement("tr");tr.innerHTML="<td>"+x.applicationId+"<br>"+(x.memberId||"")+"</td><td>"+x.name+"</td><td>"+x.mobile+"</td><td>"+x.district+"</td><td>"+x.status+"</td><td>"+(x.status==="PENDING"?"<button class='btn red' onclick=\"act('"+x.applicationId+"','approve')\">APPROVE</button> <button class='btn' onclick=\"act('"+x.applicationId+"','reject')\">REJECT</button>":"—")+"</td>";rows.appendChild(tr)})}async function act(id,type){if(!confirm(type.toUpperCase()+" this application?"))return;let r=await api({action:"adminAction",actionType:type,applicationId:id,...admin});let m=document.getElementById("panelMsg");m.className="msg "+(r.success?"success":"error");m.textContent=r.message;m.style.display="block";if(r.success)loadApps()}</script></body></html>
