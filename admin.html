<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel | RashtriyaSenaa</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header></header>
<main>
<section class="section">
<div class="container">
<div class="head">
<h2>Admin Panel</h2>
<p>Admin ID and Password are required.</p>
</div>

<div id="loginBox" class="form">
<form id="loginForm">
<div class="formgrid">
<div class="field"><label>Admin ID *</label><input name="adminId" required></div>
<div class="field"><label>Admin Password *</label><input name="password" type="password" required></div>
</div>
<div class="buttons"><button class="btn red" type="submit">LOGIN</button></div>
<div id="loginMsg" class="msg"></div>
</form>
</div>

<div id="panel" style="display:none">
<div class="card">
<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
<h3>Applications</h3>
<button class="btn red" type="button" onclick="loadApps()">REFRESH</button>
</div>

<div id="panelMsg" class="msg"></div>

<div class="tablewrap">
<table class="table">
<thead>
<tr>
<th>Application</th><th>Name</th><th>Mobile</th><th>District</th>
<th>Status</th><th>Post</th><th>Action</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>
</div>
</div>
</div>
</section>
</main>
<footer></footer>
<script src="site.js"></script>
<script>
let admin = {};

const POSTS = [
  "सदस्य","ब्लॉक अध्यक्ष","ब्लॉक उपाध्यक्ष","ब्लॉक महासचिव ","ब्लॉक सचिव","तहसील अध्यक्ष",
  "तहसील उपाध्यक्ष","तहसील महासचिव","तहसील सचिव","जिला अध्यक्ष","जिला उपाध्यक्ष","जिला महासचिव","जिला सचिव","मण्डल अध्यक्ष","मण्डल उपाध्यक्ष","मण्डल महासचिव","मण्डल सचिव",
  "प्रदेश अध्यक्ष","प्रदेश उपाध्यक्ष","प्रदेश महासचिव","प्रदेश सचिव","राष्ट्रीय अध्यक्ष","राष्ट्रीय उपाध्यक्ष","राष्ट्रीय महासचिव","राष्ट्रीय सचिव"
];

function esc(v) {
  return String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function postOptions(selected) {
  return POSTS.map(p =>
    "<option value='" + esc(p) + "' " +
    (p === selected ? "selected" : "") + ">" +
    esc(p) + "</option>"
  ).join("");
}

document.getElementById("loginForm").onsubmit = async function(e) {
  e.preventDefault();
  admin = Object.fromEntries(new FormData(e.target));

  const m = document.getElementById("loginMsg");
  m.className = "msg";
  m.style.display = "block";
  m.textContent = "Checking...";

  try {
    const r = await api({action:"adminLogin", ...admin});
    if (!r.success) {
      m.className = "msg error";
      m.textContent = r.message || "Login failed.";
      return;
    }

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("panel").style.display = "block";
    loadApps();
  } catch(err) {
    m.className = "msg error";
    m.textContent = err.message || "Connection error.";
  }
};

async function loadApps() {
  const m = document.getElementById("panelMsg");
  m.style.display = "none";

  try {
    const r = await api({action:"adminList", ...admin});

    if (!r.success) {
      m.className = "msg error";
      m.textContent = r.message || "Unable to load applications.";
      m.style.display = "block";
      return;
    }

    const rows = document.getElementById("rows");
    rows.innerHTML = "";

    (r.applications || []).forEach(x => {
      const id = String(x.applicationId || "");
      const status = String(x.status || "").toUpperCase();

      let postCell = "—";
      let actionCell = "—";

      if (status === "APPROVED") {
        postCell =
          "<select id='post_" + esc(id) + "' style='min-width:160px'>" +
          postOptions(x.post || "सदस्य") +
          "</select>";

        actionCell =
          "<button class='btn red' onclick=\"savePost('" + esc(id) + "')\">SAVE POST</button> " +
          "<button class='btn' onclick=\"rejectApplication('" + esc(id) + "')\">REJECT</button>";
      } else if (status === "PENDING") {
        actionCell =
          "<button class='btn red' onclick=\"approveApplication('" + esc(id) + "')\">APPROVE</button> " +
          "<button class='btn' onclick=\"rejectApplication('" + esc(id) + "')\">REJECT</button>";
      } else if (status === "REJECTED") {
        actionCell = "REJECTED";
      }

      const tr = document.createElement("tr");
      tr.innerHTML =
        "<td>" + esc(id) + "<br><small>" + esc(x.memberId || "") + "</small></td>" +
        "<td>" + esc(x.name) + "</td>" +
        "<td>" + esc(x.mobile) + "</td>" +
        "<td>" + esc(x.district) + "</td>" +
        "<td>" + esc(status) + "</td>" +
        "<td>" + postCell + "</td>" +
        "<td>" + actionCell + "</td>";

      rows.appendChild(tr);
    });
  } catch(err) {
    m.className = "msg error";
    m.textContent = err.message || "Connection error.";
    m.style.display = "block";
  }
}

async function savePost(applicationId) {
  const select = document.getElementById("post_" + applicationId);
  if (!select) return;

  const r = await api({
    action:"setPost",
    applicationId:applicationId,
    post:select.value,
    ...admin
  });

  showResult(r);
  if (r.success) loadApps();
}

async function approveApplication(applicationId) {
  if (!confirm("APPROVE this application?")) return;

  const r = await api({
    action:"approve",
    applicationId:applicationId,
    ...admin
  });

  showResult(r);
  if (r.success) loadApps();
}

async function rejectApplication(applicationId) {
  if (!confirm("REJECT this application?")) return;

  const r = await api({
    action:"reject",
    applicationId:applicationId,
    ...admin
  });

  showResult(r);
  if (r.success) loadApps();
}

function showResult(r) {
  const m = document.getElementById("panelMsg");
  m.className = "msg " + (r.success ? "success" : "error");
  m.textContent = r.message || (r.success ? "Done." : "Action failed.");
  m.style.display = "block";
}
</script>
</body>
</html>
