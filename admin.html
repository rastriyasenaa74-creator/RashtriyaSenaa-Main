<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel | RashtriyaSenaa</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header></header>

<main>
<section class="section">
<div class="container">

<div class="head">
<h2>Admin Panel</h2>
<p>Admin ID and Password are required.</p>
</div>

<div id="loginBox" class="form">
<form id="loginForm">
<div class="formgrid">
<div class="field">
<label>Admin ID *</label>
<input name="adminId" type="text" autocomplete="username" required>
</div>
<div class="field">
<label>Admin Password *</label>
<input name="password" type="password" autocomplete="current-password" required>
</div>
</div>
<div class="buttons">
<button type="submit" class="btn red">LOGIN</button>
</div>
<div id="loginMsg" class="msg"></div>
</form>
</div>

<div id="panel" style="display:none">
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
<h3>Applications</h3>
<div>
<button type="button" class="btn red" id="refreshBtn">REFRESH</button>
<button type="button" class="btn" id="logoutBtn">LOGOUT</button>
</div>
</div>

<div id="panelMsg" class="msg"></div>

<div class="tablewrap">
<table class="table">
<thead>
<tr>
<th>Application</th>
<th>Name</th>
<th>Mobile</th>
<th>District</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="rows">
<tr><td colspan="6">Applications load karne ke liye login karein.</td></tr>
</tbody>
</table>
</div>
</div>
</div>

</div>
</section>
</main>

<footer></footer>

<script src="site.js"></script>
<script>
let admin = {};

function showMessage(el, text, success) {
  if (!el) return;
  el.className = "msg " + (success ? "success" : "error");
  el.textContent = text || "";
  el.style.display = "block";
}

document.getElementById("loginForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const form = e.target;
  const msg = document.getElementById("loginMsg");
  const btn = form.querySelector("button[type=submit]");

  admin = {
    adminId: String(form.elements.adminId.value || "").trim(),
    password: String(form.elements.password.value || "")
  };

  if (!admin.adminId || !admin.password) {
    showMessage(msg, "Admin ID aur Password dono enter karo.", false);
    return;
  }

  btn.disabled = true;
  btn.textContent = "LOGIN...";

  try {
    const r = await api({
      action: "adminLogin",
      adminId: admin.adminId,
      password: admin.password
    });

    if (!r.success) {
      showMessage(msg, r.message || "Invalid Admin ID or Password.", false);
      return;
    }

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("panel").style.display = "block";
    await loadApps();

  } catch (err) {
    showMessage(msg, err.message || "Login failed.", false);
  } finally {
    btn.disabled = false;
    btn.textContent = "LOGIN";
  }
});

async function loadApps() {
  const msg = document.getElementById("panelMsg");
  const rows = document.getElementById("rows");

  rows.innerHTML = "<tr><td colspan='6'>Loading applications...</td></tr>";

  try {
    const r = await api({
      action: "adminList",
      adminId: admin.adminId,
      password: admin.password
    });

    if (!r.success) {
      showMessage(msg, r.message || "Applications load nahi hui.", false);
      rows.innerHTML = "<tr><td colspan='6'>Unable to load applications.</td></tr>";
      return;
    }

    const apps = r.applications || [];

    if (!apps.length) {
      rows.innerHTML = "<tr><td colspan='6'>No applications found.</td></tr>";
      msg.style.display = "none";
      return;
    }

    rows.innerHTML = "";

    apps.forEach(app => {
      const tr = document.createElement("tr");

      const application = document.createElement("td");
      application.innerHTML =
        escapeHtml(app.applicationId || "") + "<br>" +
        escapeHtml(app.memberId || "");

      const name = document.createElement("td");
      name.textContent = app.name || "";

      const mobile = document.createElement("td");
      mobile.textContent = app.mobile || "";

      const district = document.createElement("td");
      district.textContent = app.district || "";

      const status = document.createElement("td");
      status.textContent = app.status || "";

      const action = document.createElement("td");

      if (String(app.status || "").toUpperCase() === "PENDING") {
        const approve = document.createElement("button");
        approve.type = "button";
        approve.className = "btn red";
        approve.textContent = "APPROVE";
        approve.onclick = () => act(app.applicationId, "approve");

        const reject = document.createElement("button");
        reject.type = "button";
        reject.className = "btn";
        reject.textContent = "REJECT";
        reject.style.marginLeft = "6px";
        reject.onclick = () => act(app.applicationId, "reject");

        action.appendChild(approve);
        action.appendChild(reject);
      } else {
        action.textContent = "—";
      }

      tr.append(application, name, mobile, district, status, action);
      rows.appendChild(tr);
    });

    msg.style.display = "none";

  } catch (err) {
    showMessage(msg, err.message || "Applications load failed.", false);
    rows.innerHTML = "<tr><td colspan='6'>Error loading applications.</td></tr>";
  }
}

async function act(applicationId, type) {
  const action = type === "approve" ? "approve" : "reject";

  if (!confirm(
    action === "approve"
      ? "Is application ko APPROVE karna hai?"
      : "Is application ko REJECT karna hai?"
  )) return;

  const msg = document.getElementById("panelMsg");

  showMessage(
    msg,
    action === "approve"
      ? "Application approve ho rahi hai..."
      : "Application reject ho rahi hai...",
    true
  );

  try {
    /* FIX: Code.gs expects action='approve' or action='reject'.
       Old adminAction/actionType combination caused Invalid action. */
    const r = await api({
      action: action,
      applicationId: applicationId,
      adminId: admin.adminId,
      password: admin.password
    });

    if (!r.success) {
      showMessage(msg, r.message || "Action failed.", false);
      return;
    }

    let text = r.message || "Action successful.";

    if (action === "approve" && r.memberId) {
      text += " Member ID: " + r.memberId;
    }

    showMessage(msg, text, true);
    await loadApps();

  } catch (err) {
    showMessage(msg, err.message || "Action failed.", false);
  }
}

document.getElementById("refreshBtn").onclick = loadApps;

document.getElementById("logoutBtn").onclick = function() {
  admin = {};
  document.getElementById("panel").style.display = "none";
  document.getElementById("loginBox").style.display = "block";
  document.getElementById("loginForm").reset();
  document.getElementById("rows").innerHTML =
    "<tr><td colspan='6'>Applications load karne ke liye login karein.</td></tr>";
  document.getElementById("panelMsg").style.display = "none";
};

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
</script>
</body>
</html>
