<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel | RashtriyaSenaa</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header></header>

<main>
<section class="section">
<div class="container">

<div class="head">
<h2>Admin Panel</h2>
<p>Admin ID and Password are required.</p>
</div>

<div id="loginBox" class="form">
<form id="loginForm">
<div class="formgrid">
<div class="field">
<label>Admin ID *</label>
<input name="adminId" required>
</div>

<div class="field">
<label>Admin Password *</label>
<input name="password" type="password" required>
</div>
</div>

<div class="buttons">
<button class="btn red" type="submit">LOGIN</button>
</div>

<div id="loginMsg" class="msg"></div>
</form>
</div>

<div id="panel" style="display:none">

<div class="card">
<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
<h3>Applications</h3>
<button class="btn red" type="button" onclick="loadApps()">REFRESH</button>
</div>

<div id="panelMsg" class="msg"></div>

<div class="tablewrap">
<table class="table">
<thead>
<tr>
<th>Application</th>
<th>Name</th>
<th>Mobile</th>
<th>District</th>
<th>Status</th>
<th>Post</th>
<th>Action</th>
</tr>
</thead>

<tbody id="rows"></tbody>
</table>
</div>
</div>
</div>

</div>
</section>
</main>

<footer></footer>
<script src="site.js"></script>

<script>
let admin = {};

const POSTS = [
  "सदस्य",
  "ब्लॉक अध्यक्ष",
  "ब्लॉक उपाध्यक्ष",
  "तहसील अध्यक्ष",
  "तहसील उपाध्यक्ष",
  "जिला अध्यक्ष",
  "जिला उपाध्यक्ष",
  "प्रदेश अध्यक्ष",
  "प्रदेश उपाध्यक्ष",
  "राष्ट्रीय अध्यक्ष",
  "राष्ट्रीय उपाध्यक्ष"
];

document.getElementById("loginForm").onsubmit = async function(e) {
  e.preventDefault();

  admin = Object.fromEntries(new FormData(e.target));

  const m = document.getElementById("loginMsg");
  m.style.display = "block";
  m.className = "msg";
  m.textContent = "Checking...";

  try {
    const r = await api({
      action: "adminLogin",
      ...admin
    });

    if (!r.success) {
      m.className = "msg error";
      m.textContent = r.message || "Login failed.";
      return;
    }

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("panel").style.display = "block";
    loadApps();

  } catch (x) {
    m.className = "msg error";
    m.textContent = x.message || "Server connection error.";
  }
};


function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function postOptions(selected) {
  return POSTS.map(function(p) {
    return "<option value=\"" + escapeHtml(p) + "\" " +
      (p === selected ? "selected" : "") + ">" +
      escapeHtml(p) +
      "</option>";
  }).join("");
}


async function loadApps() {

  const m = document.getElementById("panelMsg");
  m.style.display = "none";

  try {

    const r = await api({
      action: "adminList",
      ...admin
    });

    if (!r.success) {
      m.className = "msg error";
      m.textContent = r.message || "Unable to load applications.";
      m.style.display = "block";
      return;
    }

    const rows = document.getElementById("rows");
    rows.innerHTML = "";

    (r.applications || []).forEach(function(x) {

      const tr = document.createElement("tr");

      let actionHtml = "";

      if (String(x.status).toUpperCase() === "PENDING") {

        actionHtml =
          "<button class='btn red' onclick=\"act('" +
          escapeHtml(x.applicationId) +
          "','approve')\">APPROVE</button> " +

          "<button class='btn' onclick=\"act('" +
          escapeHtml(x.applicationId) +
          "','reject')\">REJECT</button>";

      } else if (String(x.status).toUpperCase() === "APPROVED") {

        actionHtml =
          "<button class='btn red' onclick=\"savePost('" +
          escapeHtml(x.applicationId) +
          "')\">SAVE POST</button>";

      } else {

        actionHtml = "—";
      }

      tr.innerHTML =
        "<td>" + escapeHtml(x.applicationId) +
        "<br><small>" + escapeHtml(x.memberId || "") + "</small></td>" +

        "<td>" + escapeHtml(x.name) + "</td>" +

        "<td>" + escapeHtml(x.mobile) + "</td>" +

        "<td>" + escapeHtml(x.district) + "</td>" +

        "<td>" + escapeHtml(x.status) + "</td>" +

        "<td>" +
          (String(x.status).toUpperCase() === "APPROVED"
            ? "<select id='post_" + escapeHtml(x.applicationId) +
              "' style='min-width:160px'>" +
              postOptions(x.post || "सदस्य") +
              "</select>"
            : "—") +
        "</td>" +

        "<td>" + actionHtml + "</td>";

      rows.appendChild(tr);
    });

  } catch (x) {

    m.className = "msg error";
    m.textContent = x.message || "Server connection error.";
    m.style.display = "block";
  }
}


async function savePost(applicationId) {

  const select = document.getElementById("post_" + applicationId);

  if (!select) return;

  const post = select.value;

  const r = await api({
    action: "setPost",
    applicationId: applicationId,
    post: post,
    ...admin
  });

  const m = document.getElementById("panelMsg");

  m.className = "msg " + (r.success ? "success" : "error");
  m.textContent = r.message || "Done.";
  m.style.display = "block";

  if (r.success) {
    loadApps();
  }
}


async function act(id, type) {

  if (!confirm(type.toUpperCase() + " this application?")) {
    return;
  }

  /*
   Important:
   Backend action is exactly "approve" or "reject".
   This avoids the previous "Invalid action" problem.
  */
  const r = await api({
    action: type,
    applicationId: id,
    ...admin
  });

  const m = document.getElementById("panelMsg");

  m.className = "msg " + (r.success ? "success" : "error");
  m.textContent = r.message || "Done.";
  m.style.display = "block";

  if (r.success) {
    loadApps();
  }
}
</script>

</body>
</html>
