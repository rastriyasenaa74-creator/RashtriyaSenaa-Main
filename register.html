<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Registration | RashtriyaSenaa</title><link rel="stylesheet" href="styles.css"></head><body><header></header><main><section class="section"><div class="container"><div class="head"><h2>Member Registration</h2><p>No mobile OTP and no email OTP are used. Applications require admin approval.</p></div><div class="form"><form id="form"><div class="formgrid"><div class="field"><label>Name *</label><input name="name" required></div><div class="field"><label>Father Name *</label><input name="fatherName" required></div><div class="field"><label>Mobile *</label><input name="mobile" required></div><div class="field"><label>Email</label><input name="email" type="email"></div><div class="field"><label>Date of Birth *</label><input name="dob" type="date" required></div><div class="field"><label>District *</label><input name="district" required></div><div class="field"><label>State *</label><input name="state" required></div><div class="field"><label>Photo URL</label><input name="photo"></div><div class="field full"><label>Address *</label><textarea name="address" required></textarea></div></div><div class="buttons"><button class="btn red">SUBMIT APPLICATION</button></div><div id="msg" class="msg"></div></form></div></div></section></main><footer></footer><script src="site.js"></script><script>document.getElementById("form").onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let m=document.getElementById("msg");try{let r=await api({action:"register",...d});m.className="msg "+(r.success?"success":"error");m.textContent=r.success?"Application submitted. Application ID: "+r.applicationId:""+r.message;m.style.display="block";if(r.success)e.target.reset()}catch(x){m.className="msg error";m.textContent=x.message;m.style.display="block"}};</script></body></html>
