<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Member Registration | RashtriyaSenaa</title>
<link rel="stylesheet" href="styles.css">
<style>
.upload-box{border:2px dashed #ccc;border-radius:12px;padding:16px;background:#fafafa}
.upload-box input[type=file]{width:100%;padding:10px;background:#fff;border:1px solid #ddd;border-radius:8px}
.preview{display:none;margin-top:12px;width:110px;height:130px;border-radius:10px;object-fit:cover;border:2px solid #ddd}
.help{font-size:12px;color:#666;margin-top:6px}
</style>
</head>
<body>
<header></header>
<main><section class="section"><div class="container">
<div class="head"><h2>Member Registration</h2><p>No mobile OTP and no email OTP are used. Application will be sent to admin for approval.</p></div>
<div class="form"><form id="form">
<div class="formgrid">
<div class="field"><label>Name *</label><input name="name" required></div>
<div class="field"><label>Father Name *</label><input name="fatherName" required></div>
<div class="field"><label>Mobile *</label><input name="mobile" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required></div>
<div class="field"><label>Email</label><input name="email" type="email"></div>
<div class="field"><label>Date of Birth *</label><input name="dob" type="date" required></div>
<div class="field"><label>District *</label><input name="district" required></div>
<div class="field"><label>State *</label><input name="state" required></div>
<div class="field"><label>Upload Photo *</label><div class="upload-box"><input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp" required><img id="preview" class="preview" alt="Photo preview"><div class="help">JPG, PNG or WEBP • Maximum 5 MB</div></div></div>
<div class="field full"><label>Address *</label><textarea name="address" required></textarea></div>
</div>
<div class="buttons"><button id="submitBtn" class="btn red" type="submit">SUBMIT APPLICATION</button></div>
<div id="msg" class="msg"></div>
</form></div></div></section></main>
<footer></footer>
<script src="site.js"></script>
<script>
const form=document.getElementById('form'), fileInput=document.getElementById('photoFile'), preview=document.getElementById('preview'), msg=document.getElementById('msg'), btn=document.getElementById('submitBtn');
fileInput.addEventListener('change',()=>{const f=fileInput.files[0];if(!f)return; if(f.size>5*1024*1024){fileInput.value='';preview.style.display='none';alert('Photo 5 MB se chhoti honi chahiye.');return;} preview.src=URL.createObjectURL(f);preview.style.display='block';});
function imageToDataUrl(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const max=1000,scale=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.84));};im.onerror=reject;im.src=fr.result;};fr.onerror=reject;fr.readAsDataURL(file);});}
form.addEventListener('submit',async e=>{e.preventDefault();const f=fileInput.files[0];if(!f){alert('Photo upload karo.');return;}if(f.size>5*1024*1024){alert('Photo 5 MB se chhoti honi chahiye.');return;}btn.disabled=true;btn.textContent='UPLOADING PHOTO...';msg.style.display='block';msg.className='msg';msg.textContent='Photo upload ho rahi hai, please wait...';try{const d=Object.fromEntries(new FormData(form));d.photoData=await imageToDataUrl(f);delete d.photo;const r=await api({action:'register',...d});if(!r.success)throw new Error(r.message||'Registration failed');msg.className='msg success';msg.innerHTML='Application submitted successfully.<br><b>Application ID: '+r.applicationId+'</b><br>Status: PENDING — Admin approval ke baad Member ID aur ID Card milega.';form.reset();preview.style.display='none';}catch(x){msg.className='msg error';msg.textContent=x.message||'Something went wrong.';}finally{btn.disabled=false;btn.textContent='SUBMIT APPLICATION';}});
</script>
</body></html>
