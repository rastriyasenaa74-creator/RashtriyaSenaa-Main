<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Login | RashtriyaSenaa</title><link rel="stylesheet" href="styles.css"></head><body><header></header><main><section class="section"><div class="container"><div class="head"><h2>Member Login</h2><p>Only approved members can login.</p></div><div class="form"><form id="form"><div class="formgrid"><div class="field"><label>Member ID *</label><input name="memberId" required></div><div class="field"><label>Mobile *</label><input name="mobile" required></div></div><div class="buttons"><button class="btn red">MEMBER LOGIN</button></div><div id="msg" class="msg"></div></form><div id="result"></div></div></div></section></main><footer></footer><script src="site.js"></script><script>document.getElementById("form").onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let m=document.getElementById("msg");try{let r=await api({action:"login",...d});m.className="msg "+(r.success?"success":"error");m.textContent=r.success?"Login successful":r.message;m.style.display="block";if(r.success)document.getElementById("result").innerHTML='<div class="card"><h3>Approved Member</h3><p><b>Member ID:</b> '+r.memberId+'</p><p><b>Name:</b> '+r.name+'</p><p><b>Status:</b> APPROVED</p></div>'}catch(x){m.className="msg error";m.textContent=x.message;m.style.display="block"}};</script></body></html>
