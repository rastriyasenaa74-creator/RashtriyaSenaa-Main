<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Member Login | RashtriyaSenaa</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;color:#151515}
.wrap{max-width:1050px;margin:50px auto;padding:0 18px}.box{background:#fff;border:1px solid #ddd;border-radius:16px;padding:30px;box-shadow:0 10px 30px #0001}
h1{margin:0 0 8px}.sub{color:#666;margin-bottom:25px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid #ccc;border-radius:8px;font-size:15px}
button{border:0;background:#e21b23;color:#fff;padding:13px 20px;border-radius:8px;font-weight:800;cursor:pointer;margin-top:18px}
.msg{display:none;margin-top:15px;padding:12px;border-radius:8px}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}
#cardArea{margin-top:30px;display:none}
.id-card{background:#fff;border:1px solid #ddd;border-radius:18px;overflow:hidden;box-shadow:0 15px 40px #0002;max-width:650px;margin:auto}
.card-top{background:#111;color:#fff;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:15px}
.org{font-size:24px;font-weight:900}.suborg{font-size:12px;color:#ddd;margin-top:4px}.approved{background:#e21b23;padding:9px 12px;border-radius:7px;font-size:11px;font-weight:900}
.card-body{padding:24px;display:grid;grid-template-columns:140px 1fr;gap:22px}.photo{width:140px;height:170px;background:#f1f1f1;border:2px solid #ddd;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;color:#777;font-size:12px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}
.name{font-size:24px;margin:0 0 10px}.row{padding:7px 0;border-bottom:1px solid #eee;font-size:13px}.row b{display:inline-block;width:110px;color:#555}.green{color:#16803a;font-weight:900}
.card-foot{border-top:1px solid #eee;padding:12px 24px;display:flex;justify-content:space-between;font-size:11px;color:#777}
.actions{text-align:center;margin:15px}.actions button{margin:0 5px}.black{background:#111}
@media(max-width:600px){.grid,.card-body{grid-template-columns:1fr}.photo{margin:auto}.card-top{flex-direction:column;text-align:center}}
@media print{body *{visibility:hidden!important}.print-area,.print-area *{visibility:visible!important}.print-area{position:absolute;left:0;top:0;width:100%}.actions{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
<div class="box">
<h1>Member Login</h1>
<div class="sub">Approved members can access their Digital Membership ID Card.</div>
<form id="loginForm">
<div class="grid">
<div class="field"><label>Member ID *</label><input name="memberId" required></div>
<div class="field"><label>Mobile Number *</label><input name="mobile" required></div>
</div>
<button type="submit">LOGIN & VIEW ID CARD</button>
<div id="msg" class="msg"></div>
</form>

<div id="cardArea">
<div class="id-card print-area">
<div class="card-top">
<div><div class="org">RashtriyaSenaa</div><div class="suborg">मानव जन कल्याण समिति</div></div>
<div class="approved">APPROVED MEMBER</div>
</div>
<div class="card-body">
<div class="photo" id="photo">MEMBER<br>PHOTO</div>
<div>
<h2 class="name" id="name"></h2>
<div class="row"><b>Member ID</b><span id="memberIdOut"></span></div>
<div class="row"><b>Father Name</b><span id="father"></span></div>
<div class="row"><b>Mobile</b><span id="mobileOut"></span></div>
<div class="row"><b>District</b><span id="district"></span></div>
<div class="row"><b>State</b><span id="state"></span></div>
<div class="row"><b>Status</b><span class="green">APPROVED</span></div>
</div>
</div>
<div class="card-foot"><span>न्याय • समानता • संविधान</span><span>Digital Membership ID Card</span></div>
</div>
<div class="actions"><button type="button" onclick="window.print()">PRINT / SAVE PDF</button><button type="button" class="black" onclick="location.reload()">LOGOUT</button></div>
</div>
</div>
</div>

<script>
/* Apne deployed Google Apps Script ka /exec URL yahan rakho */
const API_URL="https://script.google.com/macros/s/AKfycbzz4mI4hYFRzBN7R6p95GQVwzeX_qhWwhByIhOsT_n9ZiG5m4rGqQvDHs8fhgKeEcuI2g/exec";

async function api(data){
 const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});
 return await r.json();
}
function text(id,v){document.getElementById(id).textContent=v||""}

document.getElementById("loginForm").addEventListener("submit",async function(e){
 e.preventDefault();
 const d=Object.fromEntries(new FormData(this)),msg=document.getElementById("msg");
 msg.style.display="block";msg.className="msg";msg.textContent="Checking...";
 document.getElementById("cardArea").style.display="none";
 try{
   const r=await api({action:"login",...d});
   if(!r.success){
     msg.className="msg err";msg.textContent=r.message||"Login failed";return;
   }
   if(String(r.status).toUpperCase()!=="APPROVED"){
     msg.className="msg err";msg.textContent="Admin approval ke baad hi ID Card milega.";return;
   }
   msg.className="msg ok";msg.textContent="Login successful — ID Card generated.";
   text("name",r.name);text("memberIdOut",r.memberId);text("father",r.fatherName);text("mobileOut",r.mobile);text("district",r.district);text("state",r.state);
   const photo=document.getElementById("photo");
   if(r.photo){photo.innerHTML="";const img=document.createElement("img");img.src=r.photo;img.alt="Member Photo";img.onerror=()=>photo.innerHTML="MEMBER<br>PHOTO";photo.appendChild(img)}
   else photo.innerHTML="MEMBER<br>PHOTO";
   document.getElementById("cardArea").style.display="block";
 }catch(err){
   msg.className="msg err";msg.textContent="Server connection error. Google Apps Script /exec URL check karo.";
 }
});
</script>
</body>
</html>
